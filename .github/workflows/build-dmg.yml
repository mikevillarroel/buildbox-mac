name: Build DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Build app
        run: |
          xcodebuild -project BuildBoxMac.xcodeproj \
            -scheme BuildBoxMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      
      - name: Create DMG
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          mkdir -p dmg
          cp -R "build/Build/Products/Release/BuildBoxMac.app" dmg/
          hdiutil create -volname "BuildBox Mac" \
            -srcfolder dmg \
            -ov -format UDZO \
            "BuildBoxMac-${TAG}.dmg"
      
      - name: Upload DMG to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: "BuildBoxMac-${{ github.event.release.tag_name || inputs.tag }}.dmg"
